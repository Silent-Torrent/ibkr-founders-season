name: Product checks
on:
  pull_request:
  push:
    branches: [main, docs/gpt-cloud-work-verification-2026-10-29]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify non-root runner and browser
        run: |
          test "$(id -u)" -ne 0
          chrome_path="$(command -v google-chrome)"
          "$chrome_path" --version
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
          if [ ! -x /bin/zsh ]; then
            sudo apt-get update
            sudo apt-get install -y zsh
          fi
      - run: npm ci
      - name: Collect mobile release gate evidence
        run: node scripts/test-browser-import.mjs --release-gate-evidence-only
        env:
          RELEASE_GATE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_GATE_QA_DIR: ${{ runner.temp }}/release-gate-evidence
      - run: npm run check
        env:
          CARD_LAYOUT_QA_DIR: ${{ runner.temp }}/fictional-layouts
      - name: Capture fictional poster layouts
        run: npm run build && node scripts/capture-poster-demo.mjs
        env:
          CARD_LAYOUT_QA_DIR: ${{ runner.temp }}/fictional-layouts
      - uses: actions/upload-artifact@v4
        with:
          name: fictional-share-card-layouts
          path: ${{ runner.temp }}/fictional-layouts/*.png
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-evidence
          path: ${{ runner.temp }}/release-gate-evidence/
          if-no-files-found: error
          retention-days: 14
